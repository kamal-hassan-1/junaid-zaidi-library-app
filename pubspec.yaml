name: junaid_zaidi_library_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  font_awesome_flutter: ^11.0.0

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Inter font (matches the original app's @expo-google-fonts/inter usage)
  google_fonts: ^6.2.1
  # Embedded Leaflet/OSM map (matches the original app's react-native-webview map screen)
  webview_flutter: ^4.10.0
  # Hands off to the native Google Maps app/browser (matches Linking.openURL)
  url_launcher: ^6.3.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  flutter_lucide: ^1.11.0
  # RSA-OAEP client-side password encryption (Updated Authentication
  # Workflow, Phase 1). pointycastle does the actual OAEP crypto;
  # basic_utils parses the PEM public key into a pointycastle RSAPublicKey.
  pointycastle: ^3.9.1
  basic_utils: ^5.7.0
  # Runtime API (preserve/remove) keeps the native splash up through Firebase
  # + session restore so AuthGate never needs a second Flutter splash screen.
  flutter_native_splash: ^2.4.7
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0
  mobile_scanner: ^7.4.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/static/Inter_18pt-Regular.ttf
          weight: 400
        - asset: assets/fonts/static/Inter_18pt-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/static/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/static/Inter_18pt-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/static/Inter_18pt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/static/Inter_18pt-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/static/Inter_18pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/static/Inter_18pt-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/static/Inter_18pt-Light.ttf
          weight: 300
        - asset: assets/fonts/static/Inter_18pt-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/static/Inter_18pt-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/static/Inter_18pt-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/static/Inter_18pt-Thin.ttf
          weight: 100
        - asset: assets/fonts/static/Inter_18pt-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/static/Inter_18pt-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/static/Inter_18pt-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/static/Inter_18pt-Black.ttf
          weight: 900
        - asset: assets/fonts/static/Inter_18pt-BlackItalic.ttf
          weight: 900
          style: italic

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
# Launcher icon is generated from the COMSATS crest (assets/logo.png).
# The two source PNGs below are produced by tool/generate_icons.ps1 — edit the
# logo and re-run that script rather than hand-editing them.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# Native OS splash is background color only (no crest). Android 12+ still
# needs an icon slot — use a fully transparent PNG so nothing is visible.
# Branded crest + copy live in lib/screens/splash_screen.dart.
#
# After `dart run flutter_native_splash:create`, re-check
# android/app/src/main/res/values-night*/styles.xml if the generator
# rewrites them.
flutter_native_splash:
  color: "#F8F9FA"
  color_dark: "#141C26"
  android: true
  ios: true
  web: false
  fullscreen: false
  android_12:
    color: "#F8F9FA"
    color_dark: "#141C26"
    image: "assets/icon/splash_transparent.png"
    image_dark: "assets/icon/splash_transparent.png"
    icon_background_color: "#F8F9FA"
    icon_background_color_dark: "#141C26"